<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 群聊 · 一条消息同时问多个 AI</title>

  <!-- ===== 全站字体：Google Noto 家族（中文/英文/数字/日文/韩文/阿拉伯文等全覆盖） =====
       按需下载：Google 会把每个语种拆成多个 unicode-range 子集，浏览器只拉当前页面真正用到的字形。
       display=swap：字体没下来前先用系统字体显示，不会白屏。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Mono:wght@400;500&display=swap"
  >

  <!-- 关键样式内联：即使样式文件被浏览器缓存，四块并排也不会失效 -->
  <style>
    .fast-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:start;width:100%}
    .fast-col{min-width:0}
    @media (max-width:820px){.fast-grid{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:560px){.fast-grid{grid-template-columns:minmax(0,1fr)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
