<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 群聊 · 一条消息同时问多个 AI</title>

  <!-- 字体：不引外部字体文件，直接用系统字体栈（见 src/style.css 的 --font-sans）。
       零下载、零 FOUT，各平台自动用上自家最好的中英文字体。 -->

  <!-- 尾斜杠纠正：产物里全是相对路径（./assets/…），若宿主把站点挂在 /abc 却没有
       自动跳转到 /abc/，相对路径会解析成 /assets/… 从而 404。这里补一次极轻量的纠正，
       保证「整个文件夹丢到任何目录、任何空间」都能直接打开。 -->
  <script>
    (function () {
      var p = location.pathname
      if (p.charAt(p.length - 1) !== '/') {
        var last = p.slice(p.lastIndexOf('/') + 1)
        if (last.indexOf('.') === -1) location.replace(p + '/' + location.search + location.hash)
      }
    })()
  </script>

  <!-- 运行时配置：相对路径，站点放在任何子目录/域名下都能找到。
       文件不存在时仅一条 404，不影响启动（代码里会用内置默认值兜底）。 -->
  <script src="./config.js"></script>

  <!-- 关键样式内联：即使样式文件被浏览器缓存，四块并排也不会失效 -->
  <style>
    .fast-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:start;width:100%}
    .fast-col{min-width:0}
    @media (max-width:820px){.fast-grid{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:560px){.fast-grid{grid-template-columns:minmax(0,1fr)}}
  </style>
  <script type="module" crossorigin src="./assets/index-Dwhw84-l.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CC6C6ohl.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
