<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI 群聊">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C6FFF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F0479A"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6BFF"/>
      <stop offset="1" stop-color="#C13BE0"/>
    </linearGradient>
  </defs>

  <!-- 底：蓝 → 紫 → 玫红 渐变圆角方块 -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- 后层气泡：半透明，暗示「群聊」里还有其他成员 -->
  <rect x="31" y="12" width="26" height="24" rx="9" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- 前层气泡（带尾巴） -->
  <path d="M17.5 22h20A9.5 9.5 0 0 1 47 31.5v7A9.5 9.5 0 0 1 37.5 48H30l-8.5 7v-7h-4A9.5 9.5 0 0 1 8 38.5v-7A9.5 9.5 0 0 1 17.5 22Z"
        fill="#FFFFFF"/>

  <!-- AI 星芒 -->
  <path d="M27.5 27.2c1 5.1 2.4 6.5 7.5 7.5-5.1 1-6.5 2.4-7.5 7.5-1-5.1-2.4-6.5-7.5-7.5 5.1-1 6.5-2.4 7.5-7.5Z"
        fill="url(#spark)"/>
</svg>
